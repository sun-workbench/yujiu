name: 每日抖音内容更新

on:
  schedule:
    # 北京时间每天早上8:00 (UTC 00:00)
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 运行每日内容更新
        run: node scripts/update-content.js

      - name: 提交并推送
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "没有内容变更，跳过提交"
          else
            git commit -m "每日自动更新: $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi
